server.port=8091
spring.application.name=ms-usuario

# Conexión dinámica para Local y Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/bd_usuario
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:duoc}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA para crear las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect