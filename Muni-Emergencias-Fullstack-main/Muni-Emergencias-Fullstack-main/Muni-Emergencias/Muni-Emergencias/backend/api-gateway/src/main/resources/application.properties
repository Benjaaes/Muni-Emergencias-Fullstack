server.port=8090
spring.application.name=api-gateway

# RUTAS
spring.cloud.gateway.routes[0].id=ms-usuario
spring.cloud.gateway.routes[0].uri=http://localhost:8091
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[1].id=ms-reporte
spring.cloud.gateway.routes[1].uri=http://localhost:8092
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reportes/**

spring.cloud.gateway.routes[2].id=ms-alerta
spring.cloud.gateway.routes[2].uri=http://localhost:8093
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/alertas/**

# CONFIGURACIÓN DE CORS ÚNICA
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false