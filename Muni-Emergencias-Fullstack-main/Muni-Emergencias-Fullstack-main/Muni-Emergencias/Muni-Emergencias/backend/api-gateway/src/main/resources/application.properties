server.port=8090
spring.application.name=api-gateway

# RUTA: MS-USUARIO + CIRCUIT BREAKER
spring.cloud.gateway.routes[0].id=ms-usuario
spring.cloud.gateway.routes[0].uri=http://${MS_USUARIO_HOST:localhost}:8091
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=usuarioCB

# RUTA: MS-REPORTE + CIRCUIT BREAKER
spring.cloud.gateway.routes[1].id=ms-reporte
spring.cloud.gateway.routes[1].uri=http://${MS_REPORTE_HOST:localhost}:8092
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reportes/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=reporteCB

# RUTA: MS-ALERTA + CIRCUIT BREAKER
spring.cloud.gateway.routes[2].id=ms-alerta
spring.cloud.gateway.routes[2].uri=http://${MS_ALERTA_HOST:localhost}:8093
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/alertas/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=alertaCB

# CONFIGURACIÓN DE CORS CENTRALIZADA
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true