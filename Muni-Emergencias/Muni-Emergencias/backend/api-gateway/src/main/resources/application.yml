server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Ruta hacia el ms-usuario
        - id: ms-usuario
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**
            
        # Ruta hacia el ms-reporte
        - id: ms-reporte
          uri: http://localhost:8082
          predicates:
            - Path=/api/reportes/**
            
        # Ruta hacia el ms-alerta
        - id: ms-alerta
          uri: http://localhost:8083
          predicates:
            - Path=/api/alertas/**
            
      # ¡Súper importante para el Frontend! (Evita el error CORS)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"