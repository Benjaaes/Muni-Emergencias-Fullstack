server:
  port: 8091  # Cambiado de 8081 a 8091 para seguir el orden 90, 91, 92...

spring:
  application:
    name: ms-usuario
  datasource:
    url: jdbc:h2:mem:usuariodb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console